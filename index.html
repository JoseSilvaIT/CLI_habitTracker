<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#050505" />

    <title>CLI_HOME</title>

    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
    <link rel="manifest" href="./manifest.json" />

    <link rel="stylesheet" href="./css/terminal.css" />
    <link rel="stylesheet" href="./css/componets.css" />
  </head>

  <body>
    <main id="app">
      <header class="system-header">
        <div class="terminal-title">CLI_HOME</div>

        <div class="system-status">STATUS: <span>ONLINE</span></div>
      </header>

      <section class="dashboard">
        <section class="panel" id="habits-panel">
          <div class="panel-header">[ HABITS ]</div>
          <div id="habits"></div>
        </section>

        <section class="panel" id="eisenhower-panel">
          <div class="panel-header">[ PRIORITY ]</div>
          <div id="eisenhower"></div>
        </section>

        <section class="panel heatmap-panel" id="heatmap-panel">
          <div class="panel-header">[ ACTIVITY ]</div>
          <div id="heatmap"></div>
        </section>

        <section class="panel" id="notes-panel">
          <div class="panel-header">[ NOTES ]</div>
          <div id="notes"></div>
        </section>
      </section>

      <footer class="system-footer">
        <span>CLI_HOME v0.1.0</span>
        <span id="clock"></span>
      </footer>
    </main>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
